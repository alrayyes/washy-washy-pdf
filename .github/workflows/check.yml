# Runs the same commands as the git hooks in lefthook.yml, so the two cannot
# drift: the hook catches it early, this is the gate that cannot be skipped.
#
# Every action is pinned to a commit SHA with the version in the comment. A tag
# like v7 is a mutable pointer someone else controls, and a workflow with write
# permission is not a thing to hand to a moving target.
name: check

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs more than the source it was given.
permissions:
  contents: read

# A push that supersedes an older run cancels it rather than queueing behind it.
# main is excluded: its runs are what the release job waits on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:md
      - run: bun run lint:yaml
      - run: bun run lint:package-json
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint:types-doc
      # A broken `files`/`exports` entry surfaces here rather than at
      # semantic-release publish time. See washy-washy-core#1's identical
      # acceptance criterion.
      - name: Confirm the published tarball only carries dist, README, LICENSE
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.log
          ! grep -qE '(^|/)(src|test)/' /tmp/pack.log
      # --reporter=junit feeds Codecov Test Analytics below - bun's own
      # test runner, no separate framework needed.
      - run: bun test --coverage --coverage-reporter=lcov --reporter=junit --reporter-outfile=unit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload ("Token required because
          # branch is protected"). That's an upload hiccup on an
          # unprivileged run, not a real test regression - true here
          # would fail every Dependabot PR's CI on that basis alone
          # (confirmed live on this repo's own PR #75, same pattern as
          # hush-hush-php's PRs #13/#14).
          fail_ci_if_error: false
      # Test Analytics: per-test failure/flake detail, not just a coverage
      # delta. !cancelled(), not the step default - this still runs when
      # `bun test` above failed (unit.xml exists either way), but not if
      # the whole run was cancelled out from under it.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: unit.xml
          fail_ci_if_error: false
      # The published reports (published-reports convention): JUnit, the
      # Cobertura conversion bun cannot write itself, and bun's own lcov.
      # Assembled on pull requests too, so a broken conversion fails before
      # the merge; only the upload below is main-only.
      - run: pip install lcov_cobertura==2.1.1
      - name: Assemble the reports
        run: |
          mkdir -p reports/tests reports/coverage
          cp unit.xml reports/tests/unit.xml
          cp coverage/lcov.info reports/coverage/lcov.info
          lcov_cobertura coverage/lcov.info --output reports/coverage/coverage.xml
          grep -q '<coverage ' reports/coverage/coverage.xml
          bun run scripts/build-reports.ts reports "${GITHUB_SHA::7}" "$(date -u +%F)"
      - name: Upload the reports
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: reports
          if-no-files-found: error

  # One Pages deployment per repo, and a second one replaces the first, so the
  # API reference and the reports are assembled into one site/ here and
  # deployed once below. Pull requests build it to prove it assembles.
  pages:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # TypeDoc builds its TS program from tsconfig.json, which has no
      # include/files of its own, so the program covers every .ts file in
      # the repo and a type error anywhere in it fails the whole run.
      # test/index.test-d.ts imports from dist/, so it has to exist first.
      - run: bun run build
      - run: bun run docs
      # TypeDoc has no option to copy an arbitrary static file to the
      # output root, so llms.txt (https://llmstxt.org/) is copied in here.
      - run: cp llms.txt docs-site/llms.txt
      - name: Assemble site/ with the docs at the root
        run: cp -r docs-site site
      - name: Download the reports
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: site/reports
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  # Behind every job that runs on main, so a red lint or scan publishes nothing.
  deploy:
    if: github.event_name == 'push'
    needs: [pages, semgrep, ltex, vale]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Pages only ever serves the latest deploy, so a superseded one is wasted.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds whether or not the URL serves the file, so fetch
      # the real thing. The retries cover the CDN catching up.
      - name: Check the live reports
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output unit.xml "${PAGE_URL%/}/reports/tests/unit.xml"
          grep -q '<testsuite' unit.xml

  # A green `bun test` only proves the existing assertions still pass, not
  # that they'd catch a real change to the code under test. Scoped to this
  # PR's own changed src/**/*.ts(x) lines (rules/testing.md's "new/changed
  # code only" mutation-testing gate), not the whole tree: documents.tsx
  # carries real, tracked inherited debt (washy-washy-pdf#101) this gate
  # doesn't retroactively demand fixed. `thresholds.break: 100` in
  # stryker.config.mjs still applies in full to whatever's in scope — a
  # single surviving mutant in a PR's own changed lines still fails this
  # job. Pull-request only: there's no base to diff against on a push.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Scope mutation testing to this PR's changed src lines
        id: scope
        run: |
          RANGES=$(bun run scripts/mutation-scope.ts "${{ github.event.pull_request.base.sha }}")
          echo "ranges=$RANGES" >> "$GITHUB_OUTPUT"
      - name: Run Stryker against the changed ranges
        if: steps.scope.outputs.ranges != ''
        run: bunx stryker run --mutate "${{ steps.scope.outputs.ranges }}"

  # The commit-msg hook already reads every message, but a hook is skippable and
  # these messages are load-bearing: semantic-release reads the Conventional
  # Commits that landed to decide the next version, so a stray "wip" is a
  # release that does not happen. Pull requests only — there is no range to
  # check on a push, and rewriting history to fix an old message is worse than
  # the typo. fetch-depth 0 because the range needs both ends of it.
  #
  # Dependabot is exempt. Its subject is always "Bump x from a to b", and
  # config-conventional's subject-case rule rejects the capital B — which is
  # not something a bot can be argued with about. What lands on main is
  # normalised by the auto-merge workflow's squash subject instead, so main
  # stays conventional without this job failing on every dependency bump.
  commits:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # commitlint resolves @commitlint/config-conventional as a sibling
      # package, so bunx alone will not find it.
      - run: bun install --frozen-lockfile
      - run: bunx --bun commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose

  # Catches a pull request that introduces a *new* dependency already known
  # bad, at merge time rather than waiting for Dependabot's next scheduled
  # scan. Free on a public repo — no GitHub Advanced Security licence needed,
  # unlike on a private one.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Cross-file taint tracking Biome's pattern-level lint doesn't do — see
  # rules/javascript.md's "Security" section. Against the free Semgrep
  # Registry ruleset, no paid tier needed. A real local run and triage on
  # 2026-09-11 came back clean against this exact config (washy-washy-pdf#88):
  # one release.yml finding, suppressed inline with reasoning, everything
  # else genuinely nothing.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install semgrep==1.177.0
      - run: |
          semgrep scan --error \
            --config p/default --config p/typescript --config p/react --config p/security-audit \
            --exclude 'dist/**' --exclude 'node_modules/**' --exclude 'coverage/**'

  # Prose gets its own two jobs rather than a line in the one above, so that
  # when the run goes red the job name says which tier failed: a grammar error
  # is a mistake and a style alert is an opinion, answered differently.

  # Mechanics. LanguageTool's rule database — grammar, spelling, punctuation,
  # the phonetic article — and mechanics have a right answer, so this blocks.
  ltex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LTEX_VERSION: "18.7.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch ltex-cli-plus
        run: |
          curl -sSfL -o ltex.tar.gz \
            "https://github.com/ltex-plus/ltex-ls-plus/releases/download/${LTEX_VERSION}/ltex-ls-plus-${LTEX_VERSION}-linux-x64.tar.gz"
          tar xzf ltex.tar.gz
          # The release carries its own Java 21, but the launcher is a Gradle
          # start script and prefers JAVA_HOME — which a GitHub runner sets to
          # its own Java 17. The class files are version 65 and 17 reads up to
          # 61, so it fails to load rather than falling back. Point JAVA_HOME
          # at the runtime that shipped beside it.
          echo "JAVA_HOME=$PWD/$(ls -d ltex-ls-plus-${LTEX_VERSION}/jdk-*)" >> "$GITHUB_ENV"
      # It reports findings with exit code 3, not 1, so a step testing for a
      # specific code would pass a failing document. Let the shell judge
      # non-zero. The files are named rather than passing `.`: LTeX traverses
      # recursively and reads plain text as prose, so a bare dot lints the
      # committed Vale vocabulary as though it were a document.
      - run: ./ltex-ls-plus-${LTEX_VERSION}/bin/ltex-cli-plus --client-configuration=.ltex.json README.md CONTRIBUTING.md SECURITY.md

  # Style. House voice, weasel words, wordiness, undefined jargon. Advice
  # rather than a verdict: Vale exits non-zero only on error-severity alerts,
  # so its warnings are reported without failing anything.
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run prose:sync
      - run: bun run lint:prose:advice
