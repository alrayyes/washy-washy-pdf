# Nobody picks a version by hand. The Conventional Commits that landed decide
# it — feat: takes the minor, fix: the patch, a BREAKING CHANGE: footer the
# major — and a merge of only docs: and chore: releases nothing at all.
#
# This is the one workflow that writes to main, and it writes nothing but the
# version and the changelog — plus the npm publish itself.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only when the checks that ran on that commit actually passed. A
    # workflow_run fires whatever the outcome, so without this a red main
    # would still cut a release.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Tag, commit the changelog, and create the GitHub release.
      contents: write
      # Comment on the issues and pull requests a release closes.
      issues: write
      pull-requests: write
      # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret anywhere. Chosen
      # over a static token: nothing to store, nothing to rotate, nothing to
      # leak. Requires the trusted publisher linked on npmjs.com for this
      # repo + this workflow filename (see washy-washy-pdf#2).
      id-token: write
    steps:
      # Without the token there is nothing to do, and nothing has gone wrong
      # either — so this reports and stops rather than failing. A release badge
      # stuck on red says the releases are broken, which would be a lie.
      - name: Is the release token here?
        id: token
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_TOKEN is not set, so nothing was released. See README.md."
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          # semantic-release reads every commit since the last tag to decide
          # what this one is, so a shallow clone would have it release the
          # wrong thing or nothing at all.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.present == 'true'
        with:
          bun-version: 1.4.0

      # bun installs it; Node runs it. semantic-release checks the runtime
      # version at startup and refuses anything outside ^22.14 || >=24.10, and
      # bun answers process.version with the Node it implements — so calling
      # the binary directly lets its shebang pick Node up. Also what
      # @semantic-release/npm needs for npm's OIDC Trusted Publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24.10.0

      - run: bun install --frozen-lockfile
        if: steps.token.outputs.present == 'true'

      # The exec plugin below re-shoots docs/*.png from the docs/*.pdf already
      # on main — not the PDFs themselves. test/screenshots.test.ts already
      # fails a pull request whose PDFs and PNGs have drifted, so the PDFs
      # going into this job are already current; regenerating them here would
      # only add churn, since @react-pdf/renderer stamps every render with a
      # fresh CreationDate and /ID even when nothing about the drawing
      # changed. Re-shooting needs pdftoppm — poppler — which ubuntu-latest
      # doesn't carry.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
        if: steps.token.outputs.present == 'true'

      - run: ./node_modules/.bin/semantic-release
        if: steps.token.outputs.present == 'true'
        env:
          # The install above puts the git hooks in place, and this step pushes
          # the changelog commit — so pre-push fires here and runs the whole
          # check suite, including a Vale that only exists after `prose:sync`.
          # Whatever this step would check already ran on this exact commit,
          # and that green run is what started this job.
          LEFTHOOK: "0"
          # Not the job token. main requires status checks, and a ruleset
          # applies those to a direct push as well as to a pull request, so the
          # changelog commit from github-actions[bot] is rejected. A token
          # belonging to someone the ruleset lets bypass is what gets it in.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
