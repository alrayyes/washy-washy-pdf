# Nobody picks a version by hand. The Conventional Commits that landed decide
# it: feat: takes the minor, fix: the patch, a BREAKING CHANGE: footer the
# major, and a merge of only docs: and chore: releases nothing at all.
#
# release-please opens and updates a release pull request, and merging that
# pull request makes it cut the tag and the GitHub release through the API.
# release-auto-merge.yml merges it once green. Nothing here pushes to main.
#
# npm Trusted Publishing is bound to this repo and to this file's name,
# release.yml, with no environment. Renaming the file or adding an
# `environment:` to the publish job breaks publishing until the trusted
# publisher on npmjs.com is changed to match.
name: release

on:
  push:
    branches: [main]
  # For publishing an already-cut release again, when the npm job failed and a
  # re-run isn't enough because this file needed a fix. The input is an
  # existing tag, e.g. "v2.6.5". Otherwise use "Re-run failed jobs": npm builds
  # provenance from the ref the run started on, so a dispatch from main
  # publishes the tag's contents with an attestation naming main's head.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish to npm
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # release-please works through RELEASE_TOKEN, so GITHUB_TOKEN gets nothing.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Not GITHUB_TOKEN: a pull request it opens gets no `check` run, so the
      # release pull request could never go green.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  # A job here, not an `on: release` workflow: Trusted Publishing names this
  # file.
  publish-npm:
    needs: release-please
    # always(): workflow_dispatch skips release-please, and a skipped `needs:`
    # job would otherwise skip this one too.
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token for npm Trusted Publishing and provenance. No npm token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # refs/tags/ so a dispatch input like "main" can't publish a branch.
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # bun installs and builds; the npm bundled with this Node publishes.
      # Trusted Publishing needs npm 11.5.1 or newer, and this one has 11.19.1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: "0"

      - run: bun run build

      # LEFTHOOK=0 again: npm publish runs the `prepare` script.
      - run: npm publish --provenance --access public
        env:
          LEFTHOOK: "0"
