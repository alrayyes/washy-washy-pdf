config:
  # markdownlint's own maintained list of rules Prettier already decides —
  # heading/blank/blockquote/fence style, trailing spaces, list markers and
  # indent — rather than hand-picking the subset that happened to conflict.
  extends: "markdownlint/style/prettier"
  # Prose wraps where it reads best; a hard column limit fights that. Off
  # under its alias, never MD013 — extends merges on the literal key, so an
  # MD013 block here would sit beside the inherited (also off) one and do
  # nothing.
  line-length: false
  # The README opens with a badge row, not a heading.
  MD041: false
  # Markdown's image syntax carries no width, and the screenshots are a tall
  # phone page next to a wide A4 one — <img> is the only way to show them
  # side by side at sensible sizes. <a> and <p> come with it, for the gallery
  # of all six sheets, each picture linking to the PDF it was shot from. A
  # Markdown table would do the layout, but Prettier pads its cells and LTeX
  # reads that padding as a repeated space — a table there fails the prose
  # gate, and these three tags do not.
  MD033:
    allowed_elements:
      - img
      - a
      - p

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  - "dist/**"
  # Vendored by `vale sync`. Generated text belongs to nobody.
  - "styles/Google/**"
  - "styles/proselint/**"
  # Written by semantic-release from the commit subjects, and committed by the
  # release job without passing through any hook. Linting it means failing a
  # run over prose no human chose and no human can fix in place.
  - "CHANGELOG.md"
